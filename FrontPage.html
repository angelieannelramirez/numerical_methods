<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Numerical Methods Visual</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: url("image/bbbg.png");
      background-size: cover;
      font-family: 'Courier New', monospace;
    }

.row {
  display: flex;
  justify-content: center;
  gap: 50px;
  text-align: center;
  flex-wrap: wrap;
  margin-top: 260px; /* ← This line is new */
}

.container {
  width: 300px;
  height: 280px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  background: none;
  padding: 0;
  margin: 0;
}

.method-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}



.container:hover {
  transform: translateY(-10px);
  box-shadow: 0 12px 24px rgba(46, 125, 50, 0.3);
  cursor: pointer;
}


.container h2 {
  font-size: 1.8rem; /* Increase size */
  color: #1b5e20;
  margin: 0;
  padding: 0 10px;
  line-height: 1.4;
}


    .container p {
      padding: 0 20px;
      font-size: 0.95rem;
      color: #333;
    }




    .container .matrix {
      font-family: monospace;
      font-size: 0.9rem;
      color: #424242;
      margin: 10px auto;
      width: fit-content;
      border-left: 2px solid #888;
      border-right: 2px solid #888;
      padding: 5px 10px;
      background: #f1f8e9;
      border-radius: 4px;
    }

    .container::after {
      content: '∑ ∫ √ ∆ π';
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 2.5rem;
      color: rgba(0, 0, 0, 0.05);
      pointer-events: none;
    }

    @media (max-width: 1000px) {
      .row {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

<div class="row">
  <div class="container">
    <a href="Cramer info.html">
    <img src="image/cramers.png" alt="Cramer's Rule" class="method-img"></a>
  </div>

  <div class="container">
    <a href="gauss info.html">
    <img src="image/gauss.png" alt="Gauss Elimination and Gauss Jordan" class="method-img"></a>
  </div>

  <div class="container">
    <a href="lu info.html">
    <img src="image/lu.png" alt="LU Decomposition" class="method-img"></a>
  </div>
</div>


</body>
</html>
