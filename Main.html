<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerical Methods</title>

<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:90vw;
    height:115vh;
    overflow:hidden;

    background:url("image/front.png") center center no-repeat;
    background-size:cover;

    position:relative;
}

/* Button Position */
.start-container{
    position:absolute;
    top:60%;
    left:55%;
    transform:translate(-50%, -50%);
}

/* Button Style */
.start-btn{
    padding:5px 35px;
    font-size:25px;
    font-weight:bold;
    border:none;
    border-radius:8px;

    background-color:#d5c245;
    color:black;

    cursor:pointer;
    transition:0.3s;
    font-family:'Gloria Hallelujah', cursive;

    box-shadow:0 4px 8px rgba(0,0,0,0.25);
}

.start-btn:hover{
    background-color:#f5f1b5;
    transform:scale(1.05);
}

.start-btn:active{
    transform:scale(0.98);
}
</style>
</head>

<body>

    <div class="start-container">
        <button class="start-btn"
                onclick="window.location.href='FrontPage.html'">
            Start
        </button>
    </div>

</body>
</html>s
